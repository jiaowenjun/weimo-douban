# Windows 桌面构建：macOS 本机无法交叉编译 Windows 产物（WebView2/NSIS
# 工具链都在 Windows 侧），由本工作流出 windows-latest 编译并上传 run
# artifacts，供本地 app/scripts/release.sh 发布时拉取合并进同一 Release
# （latest.json 的 windows-x86_64 条目 + nsis 三件套资产）。
#
# 发布流程（配合 release.sh，版本以 tauri.conf.json 为准）：
#   1. tauri.conf.json bump 版本，push 到 main
#   2. Actions 页面手动运行本工作流（产物附 version.txt 供 release.sh 校验）
#   3. 本地跑 release.sh —— 自动拉取本工作流最新成功产物并入 Release
#
# Secrets（仓库 Settings → Secrets and variables → Actions，一次性配置）：
#   TAURI_SIGNING_PRIVATE_KEY          updater 签名私钥内容
#                                     （cat ~/.tauri-keys/weimo-douban-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥口令（本仓密钥生成时口令为空，
#                                     未配置时展开为空串等同无口令）
name: app-windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # setup-node 的 pnpm 缓存默认只找仓库根 pnpm-lock.yaml，本仓锁文件
          # 在 app/ 与 frontend/web/ 两处子目录（无 workspace 根），须显式指定
          cache-dependency-path: |
            app/pnpm-lock.yaml
            frontend/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            mcp

      - name: 安装依赖（前端 + tauri CLI）
        run: |
          pnpm --dir frontend/web install --frozen-lockfile
          pnpm --dir app install --frozen-lockfile

      # GitHub release CDN 对部分资产持续 504（2026-11-08 实测 nsis-3.13.zip 与
      # nsis_tauri_utils-v0.5.3.dll 先后在 runner 与本地不可达）——tauri bundler
      # 仅在「NSIS 目录齐全且哈希匹配」时才跳过下载，故构建前经 gh api 资产通道
      # （不受 CDN 故障影响）预置整套工具集：zip 解压到 %LOCALAPPDATA%\tauri 后
      # 把 nsis-3.13/ 改名为 NSIS/（与 bundler 的 extract+rename 完全同构），DLL
      # 放 Plugins/x86-unicode/additional/，双 SHA1 对齐 bundler 内置常量即完全
      # 离线。解压用 System32 的 bsdtar（原生支持 zip；Git Bash 自带的是 GNU
      # tar 不认）。常量对应 pnpm-lock 解析的 @tauri-apps/cli 2.12.4（tauri-
      # bundler 的 NSIS_SHA1 / NSIS_TAURI_UTILS_SHA1）；升级 CLI 时须同步更新
      # tag、目录名与两个 SHA1。
      - name: 预置 NSIS 工具集（绕过 release CDN 504）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOLS="$(cygpath -u "$LOCALAPPDATA")/tauri"
          ZIP="$RUNNER_TEMP/nsis-3.13.zip"
          mkdir -p "$TOOLS"
          ZIP_ASSET=$(gh api repos/tauri-apps/binary-releases/releases/tags/nsis-3.13 \
            --jq '.assets[] | select(.name=="nsis-3.13.zip") | .id')
          gh api "repos/tauri-apps/binary-releases/releases/assets/$ZIP_ASSET" \
            -H "Accept: application/octet-stream" > "$ZIP"
          echo "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E  $ZIP" | sha1sum -c -
          /c/Windows/System32/tar.exe -xf "$ZIP" -C "$(cygpath -w "$TOOLS")"
          mv "$TOOLS/nsis-3.13" "$TOOLS/NSIS"
          DLL="$TOOLS/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
          mkdir -p "$(dirname "$DLL")"
          ASSET=$(gh api repos/tauri-apps/nsis-tauri-utils/releases/tags/nsis_tauri_utils-v0.5.3 \
            --jq '.assets[0].id')
          gh api "repos/tauri-apps/nsis-tauri-utils/releases/assets/$ASSET" \
            -H "Accept: application/octet-stream" > "$DLL"
          echo "75197FEE3C6A814FE035788D1C34EAD39349B860  $DLL" | sha1sum -c -

      - name: 构建 Windows App（含 updater 签名产物）
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir app tauri build

      # 本地产物名随 productName（微墨·豆瓣，含 CJK）；上传前统一复制为
      # ASCII 名——与 mac 侧 release.sh 同一约定（gh 上传会剥掉资产名里的
      # 非 ASCII 前缀，latest/download 直链与 updater URL 全部落空）。
      # Windows 侧用通配匹配产物文件，脚本里不写死 CJK 文件名。
      - name: 汇总产物（ASCII 资产名 + 版本校验文件）
        shell: bash
        run: |
          cd app
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' tauri.conf.json | head -1)
          NSIS=target/release/bundle/nsis
          mkdir -p ../dist
          cp "$NSIS"/*_x64-setup.exe "../dist/weimo-douban_${VERSION}_x64-setup.exe"
          # Tauri v2 NSIS 的 updater 产物=对 setup.exe 本体的 minisign 签名
          # （.exe.sig）——没有 v1 时代的 .nsis.zip 包装，updater 直接下载
          # exe 校验签名后静默安装
          cp "$NSIS"/*_x64-setup.exe.sig ../dist/weimo-douban_x64-setup.exe.sig
          echo "$VERSION" > ../dist/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/
          if-no-files-found: error
