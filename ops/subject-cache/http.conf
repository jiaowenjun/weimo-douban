# Install as /etc/nginx/conf.d/weimo-douban-subject-cache.conf (http context).
# A constant server key shares the budget across both public URL prefixes.
limit_req_zone $server_name zone=douban_cache_global:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=douban_cache_ip:1m rate=1r/s;
limit_conn_zone $server_name zone=douban_cache_connections:1m;
