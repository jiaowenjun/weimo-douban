# Include in BOTH exact /douban/api/v1/subjects/batch and
# /douban-admin/api/v1/subjects/batch locations; never include in the general API.
limit_req zone=douban_cache_global burst=2 nodelay;
limit_req zone=douban_cache_ip burst=1 nodelay;
limit_req_status 429;
limit_conn douban_cache_connections 2;
limit_conn_status 429;
add_header Retry-After 60 always;
add_header Cache-Control no-store always;
client_max_body_size 16k;
client_body_timeout 3s;
proxy_connect_timeout 1s;
proxy_read_timeout 2s;
proxy_send_timeout 2s;
# Keep the database/backend free while serving slow readers. A 256 KiB response
# fits in memory; no temporary files, and at most two responses are transmitted.
proxy_buffering on;
proxy_buffers 16 16k;
proxy_max_temp_file_size 0;
limit_rate_after 0;
limit_rate 32k;
send_timeout 5s;
include proxy_params;
proxy_pass http://127.0.0.1:8020/api/v1/subjects/batch;
