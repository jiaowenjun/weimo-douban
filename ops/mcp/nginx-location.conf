# Include only in the two exact TLS locations /douban/mcp and /douban/mcp/.
limit_req zone=douban_mcp_global burst=20 nodelay;
limit_req zone=douban_mcp_ip burst=10 nodelay;
limit_req_status 429;
limit_conn douban_mcp_connections 8;
limit_conn_status 429;
client_max_body_size 16k;
client_body_timeout 5s;
proxy_connect_timeout 2s;
proxy_read_timeout 25s;
proxy_send_timeout 10s;
send_timeout 10s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Authorization $http_authorization;
proxy_buffering off;
proxy_cache off;
proxy_max_temp_file_size 0;
access_log /var/log/nginx/weimo-douban-mcp.access.log douban_mcp;
proxy_pass http://127.0.0.1:8021/mcp;
