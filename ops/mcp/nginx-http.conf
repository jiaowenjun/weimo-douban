# Install as /etc/nginx/conf.d/weimo-douban-mcp.conf (http context).
limit_req_zone $server_name zone=douban_mcp_global:1m rate=120r/m;
limit_req_zone $binary_remote_addr zone=douban_mcp_ip:1m rate=60r/m;
limit_conn_zone $server_name zone=douban_mcp_connections:1m;
# Do not log Authorization, request bodies, or URL query strings.
log_format douban_mcp '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
