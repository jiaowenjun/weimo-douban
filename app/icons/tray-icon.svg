<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="微墨·豆瓣 托盘图标">
  <!-- 微墨·豆瓣 托盘（菜单栏）图标源稿：无边框、透明背景的纯白墨滴字形。
       菜单栏 NSStatusItem 不裁切、无系统底板，深色菜单栏下白字高对比；
       墨滴轮廓取自 weimo-logo.svg（512 视框），×1.8 放大后居中，占画布
       高约 73% 留出与相邻菜单栏图标的呼吸距；纯白平涂不带高光（白上白
       隐形）与渐变（菜单栏 1x 实际渲染约 17px，细层次只会糊）。
       注意：亮色菜单栏下纯白会隐形，如需自动适配再改 template 图像方案。
       再生方式：rsvg-convert -w 256 -h 256 tray-icon.svg -o tray-icon.png -->
  <g transform="translate(51.2 42.2) scale(1.8)">
    <path fill="#FFFFFF" d="M256 54
      C241 111 220 153 184 202
      C148 251 119 291 119 343
      C119 421 178 468 256 468
      C334 468 393 421 393 343
      C393 291 364 251 328 202
      C292 153 271 111 256 54 Z"/>
  </g>
</svg>
